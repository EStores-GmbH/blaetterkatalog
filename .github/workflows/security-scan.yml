name: Security Scan

on:
  push:
    branches: [main, staging, develop]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'  # Jeden Montag 8 Uhr

jobs:
  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks braucht die Historie
      # Das Programm gitleaks direkt statt gitleaks/gitleaks-action@v2:
      # Die Action verlangt für Organisationen einen kostenpflichtigen Lizenz-
      # schlüssel ("[EStores-GmbH] is an organization. License key is required."),
      # das Programm selbst ist frei. Gleiche .gitleaks.toml wie lokal in lefthook.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact --config .gitleaks.toml

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm audit
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high
          else
            echo "Kein package.json — Audit übersprungen (Stack noch nicht initialisiert)."
          fi
        # PHP:    composer audit
        # Python: pip-audit

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # CodeQL v4 liest den Workflow-Lauf über die API. Ohne dieses Recht
      # bricht es mit "Resource not accessible by integration" ab.
      actions: read
    steps:
      - uses: actions/checkout@v7
      # CodeQL schlägt fehl, wenn es keinen Code der Zielsprache gibt —
      # daher erst prüfen, ob JS/TS-Quellcode existiert (Stack initialisiert):
      - id: check
        name: Quellcode vorhanden?
        run: |
          if find . -path ./node_modules -prune -o \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) -print -quit | grep -q .; then
            echo "code=yes" >> "$GITHUB_OUTPUT"
          else
            echo "code=no" >> "$GITHUB_OUTPUT"
            echo "Kein JS/TS-Code gefunden — CodeQL übersprungen (Stack noch nicht initialisiert)."
          fi
      - uses: github/codeql-action/init@v4
        if: steps.check.outputs.code == 'yes'
        with:
          languages: javascript-typescript
          # Für andere Sprachen anpassen: python, java-kotlin, ruby, go
      - uses: github/codeql-action/autobuild@v4
        if: steps.check.outputs.code == 'yes'
      - uses: github/codeql-action/analyze@v4
        if: steps.check.outputs.code == 'yes'
